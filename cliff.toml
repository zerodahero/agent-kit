# git-cliff config. `mise run release:prepare <version>` prepends each new entry to
# CHANGELOG.md, so the hand-written entries for 0.1.0–0.6.0 stay as they are.

[changelog]
header = """
# Changelog

Every release ships the `zerodahero-skills` and `zerodahero-plan-capture` plugins and the
`opencode-zerodahero` npm package at one version.
"""
body = """
{%- macro version(v) -%}
{{ v | replace(from="zerodahero-skills--", to="") | trim_start_matches(pat="v") }}
{%- endmacro -%}
{% if version %}
## [{{ self::version(v=version) }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## [Unreleased]
{% endif -%}
{%- for group, commits in commits | group_by(attribute="group") %}

### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}**Breaking:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }}
{%- endfor %}
{%- endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
# Old releases were tagged zerodahero-skills--v<version>, new ones v<version>.
tag_pattern = "^(v|zerodahero-skills--v)[0-9]+\\.[0-9]+\\.[0-9]+$"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Changed" },
  { message = "^refactor", group = "<!-- 2 -->Changed" },
  { message = "^revert", group = "<!-- 2 -->Changed" },
  { message = "^docs", group = "<!-- 3 -->Docs" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(build|ci|chore|style|test)", group = "<!-- 4 -->Maintenance" },
]
