name: Validate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    name: Validate plugins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools from mise.toml
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6

      - name: Check the review method copies match
        run: scripts/check-review-method.sh

      - name: Check the plugin and package versions match
        run: scripts/check-versions.sh

      - name: Check the opencode plugin parses
        run: node --check opencode/plugin.js

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin and marketplace
        run: claude plugin validate . --strict

      - name: Validate the plan-capture plugin
        run: claude plugin validate plugins/plan-capture --strict
